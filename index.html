<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔物模板編輯器</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #eee;
            --header-bg: #252525;
            --panel-bg: #2d2d2d;
            --cell-bg: rgba(255,255,255,0.04);
            --border-color: #444;
            --shadow-color: rgba(0,0,0,0.4);
            --button-primary: #3a7bc8;
            --button-primary-hover: #4a90e2;
            --button-secondary: #444;
            --button-secondary-hover: #555;
            --button-danger: #c0392b;
            --button-danger-hover: #e74c3c;
            --button-success: #27ae60;
            --button-success-hover: #2ecc71;
            --accent: #5b9bd5;
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --text-color: #222;
            --header-bg: #ffffff;
            --panel-bg: #ffffff;
            --cell-bg: rgba(0,0,0,0.03);
            --border-color: #ddd;
            --shadow-color: rgba(0,0,0,0.08);
            --button-primary: #4a90e2;
            --button-primary-hover: #3a7bc8;
            --button-secondary: #e8e8e8;
            --button-secondary-hover: #d8d8d8;
            --button-danger: #e74c3c;
            --button-danger-hover: #c0392b;
            --button-success: #2ecc71;
            --button-success-hover: #27ae60;
            --accent: #4a90e2;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .fixed-header {
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            padding: 12px 20px;
            box-shadow: 0 2px 12px var(--shadow-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Board */
        .board-wrapper {
            flex: 0 0 auto;
        }

        .board-container {
            position: relative;
            width: fit-content;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow-color);
            background: #222;
            padding: 0;
        }

        .board-background {
            position: absolute;
            inset: 0;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            border-radius: 6px;
            pointer-events: none;
        }

        .board {
            display: grid;
            gap: 0;
            position: relative;
            z-index: 1;
            border: none;
        }

        .cell {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            background: transparent;
            position: relative;
            cursor: pointer;
            transition: background 0.12s;
            overflow: hidden;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .cell.has-unit {
            background: transparent;
        }

        .cell.drag-over {
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .unit-img {
            position: absolute;
            inset: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            object-fit: contain;
            pointer-events: none;
            image-rendering: auto;
            z-index: 2;
        }

        /* Controls Panel */
        .controls-panel {
            flex: 1;
            min-width: 280px;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section {
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 9px 14px;
            background-color: var(--button-primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            flex: 1;
            min-width: 80px;
        }

        button:hover {
            background-color: var(--button-primary-hover);
            transform: translateY(-1px);
        }

        button:active { transform: translateY(0); }

        button.secondary {
            background-color: var(--button-secondary);
            color: var(--text-color);
        }
        button.secondary:hover { background-color: var(--button-secondary-hover); }

        button.danger {
            background-color: var(--button-danger);
        }
        button.danger:hover { background-color: var(--button-danger-hover); }

        button.success {
            background-color: var(--button-success);
        }
        button.success:hover { background-color: var(--button-success-hover); }

        button.active {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Units grid */
        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
            padding: 4px;
        }

        .unit-option {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 2px solid transparent;
            background: var(--bg-color);
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: all 0.2s;
            position: relative;
            user-select: none;
        }

        .unit-option:active {
            cursor: grabbing;
        }

        .unit-option:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .unit-option.selected {
            border-color: var(--button-primary);
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.35);
        }

        .unit-option img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .unit-option .unit-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            font-size: 9px;
            text-align: center;
            background: rgba(0,0,0,0.65);
            color: #fff;
            padding: 1px 2px;
            border-radius: 0 0 6px 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hint {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 6px;
            line-height: 1.4;
        }

        /* Empty state */
        .empty-units {
            text-align: center;
            padding: 30px 10px;
            opacity: 0.6;
            font-size: 13px;
            grid-column: 1 / -1;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .controls-panel {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="fixed-header">
        <h1 class="header-title">魔物模板編輯器</h1>
        <div class="header-actions">
            <button id="themeToggle" class="secondary">淺色模式</button>
        </div>
    </div>

    <div class="container">
        <!-- Board -->
        <div class="board-wrapper">
            <div class="board-container">
                <div class="board-background" id="boardBackground"></div>
                <div class="board" id="gameBoard"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-panel">
            <!-- Board Size -->
            <div class="section">
                <div class="section-title">模板大小</div>
                <select id="gridSizeSelect">
                    <option value="7x5">7 × 5</option>
                </select>
            </div>

            <!-- Units (auto-loaded from icon/) -->
            <div class="section">
                <div class="section-title">魔物圖片</div>
                <div class="units-grid" id="unitsGrid">
                    <div class="empty-units">正在讀取 icon 資料夾…</div>
                </div>
                <div class="hint">將圖片拖曳到模板格子上即可放置</div>
                <div class="hint">點擊圖片後再點擊模板也可放置</div>
            </div>

            <!-- Tools -->
            <div class="section">
                <div class="section-title">操作</div>
                <div class="button-group">
                    <button id="deleteModeBtn" class="secondary">刪除模式</button>
                    <button id="clearBtn" class="danger">清空模板</button>
                </div>
                <div class="button-group" style="margin-top:8px;">
                    <button id="copyTemplateBtn" class="success">複製模板</button>
                </div>
                <div class="hint">按下後會截取模板圖片到剪貼簿，可用 Ctrl+V 貼上</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== State ====================
        const state = {
            cols: 7,
            rows: 5,
            cellW: 105,
            cellH: 112,
            nativeCellW: 105,
            nativeCellH: 112,
            colFracs: null,
            rowFracs: null,
            selectedUnitId: null,
            deleteMode: false,
            units: {},
            loadedIcons: [],
            bgImage: null
        };

        // ==================== DOM ====================
        const boardEl = document.getElementById('gameBoard');
        const boardBgEl = document.getElementById('boardBackground');
        const unitsGrid = document.getElementById('unitsGrid');
        const gridSizeSelect = document.getElementById('gridSizeSelect');
        const deleteModeBtn = document.getElementById('deleteModeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyTemplateBtn = document.getElementById('copyTemplateBtn');
        const themeToggle = document.getElementById('themeToggle');
        const toastEl = document.getElementById('toast');

        // ==================== Helpers ====================
        function showToast(msg, duration = 2200) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        function getCellKey(x, y) {
            return `${x}-${y}`;
        }

        // ==================== Background (固定 board-bg-hedge.png) ====================
        function loadFixedBackground() {
            const url = 'board-bg-hedge.png';
            boardBgEl.style.backgroundImage = `url('${url}')`;

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                state.bgImage = img;
                state.cols = 7;
                state.rows = 5;
                gridSizeSelect.value = '7x5';
                const maxW = window.innerWidth < 768 ? 340 : 700;
                const scale = Math.min(1, maxW / img.naturalWidth);
                state.cellW = Math.round((img.naturalWidth / state.cols) * scale);
                state.cellH = Math.round((img.naturalHeight / state.rows) * scale);
                state.nativeCellW = img.naturalWidth / state.cols;
                state.nativeCellH = img.naturalHeight / state.rows;

                // 進行歸一化處理（確保列與行的比例加總精確為 1）
                const rawCol = [93, 95, 95, 96, 95, 98, 100];
                const sumCol = rawCol.reduce((a, b) => a + b, 0);
                state.colFracs = rawCol.map(v => v / sumCol);

                const rawRow = [110, 115, 116, 116, 115];
                const sumRow = rawRow.reduce((a, b) => a + b, 0);
                state.rowFracs = rawRow.map(v => v / sumRow);

                createBoard();
            };
            img.src = url;
        }

        // ==================== Board ====================
        function createBoard() {
            boardEl.innerHTML = '';
            if (state.colFracs && state.colFracs.length === state.cols) {
                const totalW = state.cellW * state.cols;
                boardEl.style.gridTemplateColumns = state.colFracs.map(f => Math.round(f * totalW) + 'px').join(' ');
            } else {
                boardEl.style.gridTemplateColumns = `repeat(${state.cols}, ${state.cellW}px)`;
            }
            if (state.rowFracs && state.rowFracs.length === state.rows) {
                const totalH = state.cellH * state.rows;
                boardEl.style.gridTemplateRows = state.rowFracs.map(f => Math.round(f * totalH) + 'px').join(' ');
            } else {
                boardEl.style.gridTemplateRows = `repeat(${state.rows}, ${state.cellH}px)`;
            }
            boardEl.style.setProperty('--cell-w', state.cellW + 'px');
            boardEl.style.setProperty('--cell-h', state.cellH + 'px');

            for (let y = 0; y < state.rows; y++) {
                for (let x = 0; x < state.cols; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;

                    const key = getCellKey(x, y);
                    if (state.units[key]) {
                        cell.classList.add('has-unit');
                        renderUnitInCell(cell, state.units[key]);
                    }

                    cell.addEventListener('click', () => onCellClick(x, y));

                    cell.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'copy';
                        boardEl.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
                        cell.classList.add('drag-over');
                    });
                    cell.addEventListener('dragleave', (e) => {
                        if (!cell.contains(e.relatedTarget)) {
                            cell.classList.remove('drag-over');
                        }
                    });
                    cell.addEventListener('drop', (e) => {
                        e.preventDefault();
                        boardEl.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
                        if (state.deleteMode) return;
                        const unitId = e.dataTransfer.getData('text/plain');
                        const icon = state.loadedIcons.find(i => i.id === unitId);
                        if (icon) placeUnit(x, y, icon);
                    });

                    boardEl.appendChild(cell);
                }
            }
        }

        function renderUnitInCell(cell, unitData) {
            const img = document.createElement('img');
            img.className = 'unit-img';
            img.src = unitData.src;
            cell.appendChild(img);
        }

        function placeUnit(x, y, icon) {
            const key = getCellKey(x, y);
            state.units[key] = {
                id: icon.id,
                name: icon.name,
                src: icon.src
            };
            createBoard();
        }

        function onCellClick(x, y) {
            const key = getCellKey(x, y);

            if (state.deleteMode) {
                if (state.units[key]) {
                    delete state.units[key];
                    createBoard();
                    showToast('已刪除');
                }
                return;
            }

            if (state.selectedUnitId) {
                const icon = state.loadedIcons.find(i => i.id === state.selectedUnitId);
                if (icon) placeUnit(x, y, icon);
            }
        }

        // ==================== Auto-load Icons from icon/ ====================
        async function autoLoadIcons() {
            state.loadedIcons = [];
            unitsGrid.innerHTML = '';
            const maxTry = 50;
            const found = [];

            const tryLoad = (n) => new Promise((resolve) => {
                const src = `icon/image${n}.png`;
                const img = new Image();
                img.onload = () => resolve({ n, src, ok: true });
                img.onerror = () => resolve({ n, src, ok: false });
                img.src = src;
            });

            const results = await Promise.all(
                Array.from({ length: maxTry + 1 }, (_, i) => tryLoad(i))
            );

            results
                .filter(r => r.ok)
                .sort((a, b) => a.n - b.n)
                .forEach(r => {
                    const name = `image${r.n}`;
                    const id = `unit_${r.n}`;
                    const icon = { id, name, src: r.src };
                    state.loadedIcons.push(icon);
                    found.push(icon);
                });

            if (found.length === 0) {
                unitsGrid.innerHTML = `
                    <div class="empty-units">
                        找不到魔物圖片<br>
                        請在 icon 資料夾放入圖片
                    </div>`;
                return;
            }

            found.forEach(icon => {
                const opt = document.createElement('div');
                opt.className = 'unit-option';
                opt.dataset.id = icon.id;
                opt.draggable = true;
                opt.title = icon.name + '（拖曳到模板）';

                const img = document.createElement('img');
                img.src = icon.src;
                img.alt = icon.name;
                img.draggable = false;
                opt.appendChild(img);

                opt.addEventListener('click', () => {
                    document.querySelectorAll('.unit-option').forEach(el => el.classList.remove('selected'));
                    opt.classList.add('selected');
                    state.selectedUnitId = icon.id;
                    state.deleteMode = false;
                    deleteModeBtn.classList.remove('active');
                    deleteModeBtn.textContent = '刪除模式';
                });

                opt.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', icon.id);
                    e.dataTransfer.effectAllowed = 'copy';
                    opt.classList.add('selected');
                    state.selectedUnitId = icon.id;
                });

                unitsGrid.appendChild(opt);
            });

            showToast(`已自動載入 ${found.length} 張魔物圖片`);
        }

        document.addEventListener('dragend', () => {
            document.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
        });

        // ==================== Controls ====================
        gridSizeSelect.addEventListener('change', () => {
            const [cols, rows] = gridSizeSelect.value.split('x').map(Number);
            state.cols = cols;
            state.rows = rows;
            Object.keys(state.units).forEach(key => {
                const [x, y] = key.split('-').map(Number);
                if (x >= cols || y >= rows) delete state.units[key];
            });
            createBoard();
        });

        deleteModeBtn.addEventListener('click', () => {
            state.deleteMode = !state.deleteMode;
            deleteModeBtn.classList.toggle('active', state.deleteMode);
            deleteModeBtn.textContent = state.deleteMode ? '取消刪除' : '刪除模式';
            if (state.deleteMode) {
                state.selectedUnitId = null;
                document.querySelectorAll('.unit-option').forEach(el => el.classList.remove('selected'));
            }
        });

        clearBtn.addEventListener('click', () => {
            if (Object.keys(state.units).length === 0) return;
            if (confirm('確定要清空整個模板嗎？')) {
                state.units = {};
                createBoard();
                showToast('模板已清空');
            }
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggle.textContent = isLight ? '深色模式' : '淺色模式';
        });

        // ==================== Copy Template ====================
        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                try {
                    canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob empty')), 'image/png');
                } catch (e) {
                    reject(e);
                }
            });
        }

        async function copyBoardTemplate() {
            if (!state.bgImage) {
                showToast('背景圖尚未載入完成，請稍候再試');
                return;
            }

            showToast('正在產生圖片…');

            const canvas = document.createElement('canvas');
            canvas.width = state.bgImage.naturalWidth;
            canvas.height = state.bgImage.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;

            try {
                ctx.drawImage(state.bgImage, 0, 0, canvas.width, canvas.height);
            } catch (e) {
                console.warn('draw bg failed', e);
                showToast('繪製背景失敗');
                return;
            }

            // 計算各列/行在 Canvas 上的精確像素位置
            const colW = state.colFracs.map(f => f * canvas.width);
            const rowH = state.rowFracs.map(f => f * canvas.height);

            const colX = [0];
            for (let i = 0; i < state.cols; i++) colX.push(colX[i] + colW[i]);
            const rowY = [0];
            for (let i = 0; i < state.rows; i++) rowY.push(rowY[i] + rowH[i]);

            const drawPromises = [];
            for (const [key, unit] of Object.entries(state.units)) {
                const [x, y] = key.split('-').map(Number);
                drawPromises.push(new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        try {
                            const cellW = colW[x];
                            const cellH = rowH[y];
                            const padX = cellW * 0.08;
                            const padY = cellH * 0.08;

                            const boxW = cellW - padX * 2;
                            const boxH = cellH - padY * 2;

                            // 模擬 CSS object-fit: contain (保持長寬比例並居中)
                            const imgAspect = img.naturalWidth / img.naturalHeight;
                            const boxAspect = boxW / boxH;

                            let drawW = boxW;
                            let drawH = boxH;
                            let drawX = colX[x] + padX;
                            let drawY = rowY[y] + padY;

                            if (imgAspect > boxAspect) {
                                drawH = boxW / imgAspect;
                                drawY += (boxH - drawH) / 2;
                            } else {
                                drawW = boxH * imgAspect;
                                drawX += (boxW - drawW) / 2;
                            }

                            ctx.drawImage(img, drawX, drawY, drawW, drawH);
                        } catch (e) {
                            console.warn('draw unit failed', e);
                        }
                        resolve();
                    };
                    img.onerror = resolve;
                    img.src = unit.src;
                }));
            }
            await Promise.all(drawPromises);

            let blob = null;
            try {
                blob = await canvasToBlob(canvas);
            } catch (e) {
                console.warn('toBlob failed, try dataURL', e);
                try {
                    const dataUrl = canvas.toDataURL('image/png');
                    const res = await fetch(dataUrl);
                    blob = await res.blob();
                } catch (e2) {
                    console.warn('dataURL path failed', e2);
                    showToast('產生圖片失敗（可能是圖片跨域限制）');
                    return;
                }
            }

            // 1) 剪貼簿
            if (navigator.clipboard && window.ClipboardItem) {
                try {
                    const item = new ClipboardItem({
                        'image/png': blob instanceof Blob ? blob : Promise.resolve(blob)
                    });
                    await navigator.clipboard.write([item]);
                    showToast('已複製模板到剪貼簿！可用 Ctrl+V 貼上');
                    return;
                } catch (err) {
                    console.warn('Clipboard write failed:', err);
                }
                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': Promise.resolve(blob) })
                    ]);
                    showToast('已複製模板到剪貼簿！可用 Ctrl+V 貼上');
                    return;
                } catch (err2) {
                    console.warn('Clipboard write retry failed:', err2);
                }
            }

            // 2) 後備：觸發下載
            try {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'board-template.png';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                    a.remove();
                }, 2000);
                showToast('無法寫入剪貼簿，已下載 board-template.png');
            } catch (err3) {
                console.warn('Download failed:', err3);
                showToast('複製失敗：請用 Chrome / Edge，並允許剪貼簿權限');
            }
        }

        copyTemplateBtn.addEventListener('click', () => {
            copyTemplateBtn.disabled = true;
            copyBoardTemplate().finally(() => {
                copyTemplateBtn.disabled = false;
            });
        });

        // ==================== Init ====================
        createBoard();
        loadFixedBackground();
        autoLoadIcons();
    </script>
</body>
</html>

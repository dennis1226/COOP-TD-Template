<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CO-OP TD 模板編輯器</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- 頂部固定操作列 -->
    <header class="fixed-header">
        <div class="header-left-group">
            <h1 class="header-title">CO-OP TD 模板編輯器</h1>
            <button id="updateLogBtn" class="secondary" type="button">更新記錄</button>
        </div>

        <div class="header-save-group">
            <select id="bgSelect" class="bg-select header-bg-select">
                <option value="background/board-bg-hedge.png">綠籬地形 (預設)</option>
                <option value="background/board-bg-guardwall.png">城牆地形</option>
                <option value="background/board-bg-dungeon.png">對戰地牢地形</option>
            </select>
            <input type="text" id="templateNameInput" placeholder="輸入模板名稱 (最多20字)" maxlength="20">
            <button id="saveTemplateBtn" class="primary btn-hidden" type="button">儲存</button>
            <button id="updateTemplateBtn" class="success btn-hidden" type="button">更新</button>
        </div>

        <div class="header-actions">
            <button id="openDrawerBtn" class="primary" type="button">📁 模板庫</button>
            <button id="themeToggle" class="secondary" type="button">淺色模式</button>
        </div>
    </header>

    <!-- 形態選擇彈窗 -->
    <div class="modal-overlay" id="formModalOverlay">
        <div class="form-modal">
            <div class="form-modal-header">
                <span id="formModalTitle">選擇魔物形態</span>
                <button class="drawer-close-btn" id="closeFormModalBtn" type="button">✕</button>
            </div>
            <div class="forms-grid" id="formsGrid"></div>
        </div>
    </div>

    <!-- 更新記錄彈窗 -->
    <div class="modal-overlay" id="updateLogOverlay">
        <div class="log-modal">
            <div class="form-modal-header">
                <span>更新記錄</span>
                <button class="drawer-close-btn" id="closeUpdateLogBtn" type="button">✕</button>
            </div>
            <div class="log-list" id="logListContainer">
                <div style="text-align: center; color: #888; padding: 20px;">載入中...</div>
            </div>
        </div>
    </div>

    <!-- 模板庫側邊抽屜 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="templates-drawer" id="templatesDrawer">
        <div class="drawer-header-section">
            <span class="drawer-title">📁 模板庫</span>
            <div class="drawer-header-actions">
                <button id="addFolderBtn" class="secondary add-folder-btn" type="button">📁 新增資料夾</button>
                <button class="drawer-close-btn" id="closeDrawerBtn" type="button">✕</button>
            </div>
        </div>
        <div class="saved-templates-list" id="savedTemplatesList"></div>
    </aside>

    <!-- 主內容區塊 -->
    <main class="container">
        <!-- 上方：場地棋盤 -->
        <div class="board-wrapper">
            <div class="board-container" id="boardContainer">
                <div class="board-background" id="boardBackground"></div>
                <div class="board" id="gameBoard"></div>
            </div>
        </div>

        <!-- 下方：操作標籤頁面 -->
        <div class="mobile-tab-container">
            <nav class="mobile-tab-nav">
                <button class="mobile-tab-btn active" data-tab="tab-monsters" type="button">👹 魔物</button>
                <button class="mobile-tab-btn" data-tab="tab-desc" type="button">📝 說明</button>
                <button class="mobile-tab-btn" data-tab="tab-tools" type="button">🛠️ 操作</button>
            </nav>
            
            <div class="mobile-tab-content-wrapper">
                <!-- Tab 1: 魔物 -->
                <section class="mobile-tab-pane active" id="tab-monsters">
                    <div class="section tab-section-borderless">
                        <div class="units-grid-scroll-area">
                            <div class="units-grid" id="unitsGrid">
                                <div class="empty-units">正在讀取 icon 資料夾…</div>
                            </div>
                        </div>
                        <div class="hint">💡 點擊選取魔物 ➔ 點擊棋盤格子即可放下</div>
                        <div class="hint">💡 點擊已選取魔物或雙擊棋盤魔物可切換形態</div>
                    </div>
                </section>

                <!-- Tab 2: 陣容說明 -->
                <section class="mobile-tab-pane" id="tab-desc">
                    <div class="section tab-section-borderless">
                        <textarea id="templateDescInput" class="template-desc-textarea" placeholder="請輸入此陣容的詳細說明、打法技巧或注意事項..." rows="14"></textarea>
                    </div>
                </section>

                <!-- Tab 3: 工具與操作 -->
                <section class="mobile-tab-pane" id="tab-tools">
                    <div class="section tab-section-borderless">
                        <div class="tools-container">
                            <!-- 類別 1: 編輯操作 -->
                            <div class="tool-group">
                                <div class="tool-category-header">✏️ 編輯操作</div>
                                <div class="tool-grid">
                                    <button id="undoBtn" class="secondary" disabled type="button">↩️ 復原</button>
                                    <button id="redoBtn" class="secondary" disabled type="button">↪️ 重做</button>
                                    <button id="orderModeBtn" class="secondary" type="button">🔢 標示製作順序</button>
                                    <button id="deleteModeBtn" class="danger" type="button">🗑️ 刪除模式(單格)</button>
                                    <button id="clearBtn" class="danger" type="button">清除整版</button>
                                </div>
                            </div>

                            <!-- 類別 2: 圖片產生 -->
                            <div class="tool-group">
                                <div class="tool-category-header">🖼️ 圖片產生</div>
                                <div class="tool-grid">
                                    <button id="copyTemplateBtn" class="success" type="button">複製模板圖片</button>
                                    <button id="saveImageBtn" class="success" type="button">儲存圖片</button>
                                    <button id="downloadImageBtn" class="success" type="button">下載圖片</button>
                                </div>
                            </div>

                            <!-- 類別 3: 檔案管理 -->
                            <div class="tool-group">
                                <div class="tool-category-header">📁 檔案管理</div>
                                <div class="tool-grid">
                                    <button id="exportJsonBtn" class="secondary" type="button">📤 匯出模板</button>
                                    <button id="importJsonBtn" class="secondary" type="button">📥 匯入模板</button>
                                    <input type="file" id="importFileInput" accept=".json" class="hidden-input">
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>
</body>
</html>

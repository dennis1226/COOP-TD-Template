<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COOP-TD-Template</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #eee;
            --header-bg: #252525;
            --panel-bg: #2d2d2d;
            --cell-bg: rgba(255,255,255,0.04);
            --border-color: #444;
            --shadow-color: rgba(0,0,0,0.4);
            --button-primary: #3a7bc8;
            --button-primary-hover: #4a90e2;
            --button-secondary: #444;
            --button-secondary-hover: #555;
            --button-danger: #c0392b;
            --button-danger-hover: #e74c3c;
            --button-success: #27ae60;
            --button-success-hover: #2ecc71;
            --accent: #5b9bd5;
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --text-color: #222;
            --header-bg: #ffffff;
            --panel-bg: #ffffff;
            --cell-bg: rgba(0,0,0,0.03);
            --border-color: #ddd;
            --shadow-color: rgba(0,0,0,0.08);
            --button-primary: #4a90e2;
            --button-primary-hover: #3a7bc8;
            --button-secondary: #e8e8e8;
            --button-secondary-hover: #d8d8d8;
            --button-danger: #e74c3c;
            --button-danger-hover: #c0392b;
            --button-success: #2ecc71;
            --button-success-hover: #27ae60;
            --accent: #4a90e2;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .fixed-header {
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            padding: 12px 20px;
            box-shadow: 0 2px 12px var(--shadow-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .header-actions button {
            flex: initial;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
            align-items: flex-start;
        }

        /* Board */
        .board-wrapper {
            flex: 0 0 auto;
        }

        .board-container {
            position: relative;
            width: fit-content;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow-color);
            background: #222;
            padding: 0;
        }

        .board-background {
            position: absolute;
            inset: 0;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            border-radius: 6px;
            pointer-events: none;
        }

        .board {
            display: grid;
            gap: 0;
            position: relative;
            z-index: 1;
            border: none;
        }

        .cell {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            background: transparent;
            position: relative;
            cursor: pointer;
            transition: background 0.12s;
            overflow: hidden;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .cell.has-unit {
            background: transparent;
        }

        .cell.drag-over {
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .cell.disabled {
            cursor: not-allowed !important;
            background: transparent;
        }
        .cell.disabled:hover {
            background: rgba(255, 255, 255, 0.12) !important;
        }

        .unit-img {
            position: absolute;
            inset: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            object-fit: contain;
            pointer-events: none;
            image-rendering: auto;
            z-index: 2;
        }

        /* Controls Panel */
        .controls-panel {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section {
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 10px var(--shadow-color);
            width: 100%;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 9px 12px;
            background-color: var(--button-primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            flex: 1;
            min-width: 60px;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--button-primary-hover);
            transform: translateY(-1px);
        }

        button:active { transform: translateY(0); }

        button.secondary {
            background-color: var(--button-secondary);
            color: var(--text-color);
        }
        button.secondary:hover { background-color: var(--button-secondary-hover); }

        button.danger {
            background-color: var(--button-danger);
        }
        button.danger:hover { background-color: var(--button-danger-hover); }

        button.success {
            background-color: var(--button-success);
        }
        button.success:hover { background-color: var(--button-success-hover); }

        button.active {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Units grid */
        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
            padding: 4px;
            width: 100%;
        }

        .unit-option {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 2px solid transparent;
            background: var(--bg-color);
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: all 0.2s;
            position: relative;
            user-select: none;
        }

        .unit-option:active {
            cursor: grabbing;
        }

        .unit-option:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .unit-option.selected {
            border-color: var(--button-primary);
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.35);
        }

        .unit-option img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hint {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 6px;
            line-height: 1.4;
        }

        .empty-units {
            text-align: center;
            padding: 20px 10px;
            opacity: 0.6;
            font-size: 13px;
            grid-column: 1 / -1;
        }

        /* Drawer Overlay and Container */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1002;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .drawer-overlay.open {
            display: block;
            opacity: 1;
        }

        .templates-drawer {
            position: fixed;
            top: 0;
            right: -360px;
            width: 350px;
            height: 100vh;
            background: var(--panel-bg);
            box-shadow: -4px 0 20px var(--shadow-color);
            z-index: 1003;
            transition: right 0.3s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .templates-drawer.open {
            right: 0;
        }

        .drawer-close-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            min-width: auto;
            flex: initial;
        }

        .saved-templates-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
        }

        .template-card {
            background: var(--cell-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .template-card-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-color);
            word-break: break-all;
        }

        .template-card-meta {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .template-card-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 1100px) {
            .container {
                width: 100%;
            }
            .templates-drawer {
                width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="fixed-header">
        <h1 class="header-title">魔物模板編輯器</h1>
        <div class="header-actions">
            <button id="openDrawerBtn" class="primary">📁 模板庫</button>
            <button id="themeToggle" class="secondary">淺色模式</button>
        </div>
    </div>

    <!-- 側邊欄遮罩與抽屜 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="templates-drawer" id="templatesDrawer">
        <div class="section-title">
            <span>📁 模板庫</span>
            <button class="drawer-close-btn" id="closeDrawerBtn">✕</button>
        </div>
        <div class="saved-templates-list" id="savedTemplatesList">
            <!-- 歷史模板會顯示在這裡 -->
        </div>
    </div>

    <div class="container">
        <!-- Board -->
        <div class="board-wrapper">
            <div class="board-container">
                <div class="board-background" id="boardBackground"></div>
                <div class="board" id="gameBoard"></div>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <!-- Units -->
            <div class="section">
                <div class="section-title">魔物圖片</div>
                <div class="units-grid" id="unitsGrid">
                    <div class="empty-units">正在讀取 icon 資料夾…</div>
                </div>
                <div class="hint">將圖片拖曳到模板格子上即可放置</div>
                <div class="hint">點擊圖片後再點擊模板也可放置</div>
            </div>

            <!-- Tools -->
            <div class="section">
                <div class="section-title">操作</div>
                <div class="button-group">
                    <button id="deleteModeBtn" class="secondary">刪除模式</button>
                    <button id="clearBtn" class="danger">清空模板</button>
                </div>
                <div class="button-group" style="margin-top:8px;">
                    <button id="copyTemplateBtn" class="success">複製模板圖片</button>
                </div>
                <div class="hint">按下後會截取模板圖片到剪貼簿，可用 Ctrl+V 貼上</div>
            </div>

            <!-- 儲存模板區塊 -->
            <div class="section">
                <div class="section-title">儲存目前模板</div>
                <input type="text" id="templateNameInput" placeholder="輸入模板名稱 (例如：第一關防守)" maxlength="20">
                <div class="button-group" style="margin-top: 8px;">
                    <button id="saveTemplateBtn" class="primary">儲存至模板庫</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== Storage Management ====================
        const STORAGE_KEY = 'coop_saved_templates';

        function setCookie(name, value, days = 365) {
            try {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                const expires = "expires=" + date.toUTCString();
                document.cookie = `${name}=${encodeURIComponent(value)}; ${expires}; path=/; SameSite=Strict`;
            } catch (e) {
                console.warn("Set Cookie failed:", e);
            }
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(nameEQ) === 0) {
                    return decodeURIComponent(c.substring(nameEQ.length, c.length));
                }
            }
            return null;
        }

        function getSavedTemplates() {
            try {
                const localData = localStorage.getItem(STORAGE_KEY);
                if (localData) return JSON.parse(localData);
            } catch (e) {}

            const cookieData = getCookie(STORAGE_KEY);
            if (cookieData) {
                try { return JSON.parse(cookieData); } catch (e) {}
            }
            return [];
        }

        function saveSavedTemplates(templates) {
            const jsonStr = JSON.stringify(templates);
            try {
                localStorage.setItem(STORAGE_KEY, jsonStr);
            } catch (e) {
                console.warn("LocalStorage failed:", e);
            }
            setCookie(STORAGE_KEY, jsonStr);
        }

        // ==================== State ====================
        const state = {
            cols: 7,
            rows: 5,
            cellW: 105,
            cellH: 112,
            nativeCellW: 105,
            nativeCellH: 112,
            colFracs: null,
            rowFracs: null,
            selectedUnitId: null,
            deleteMode: false,
            units: {},
            loadedIcons: [],
            bgImage: null,

            blockedCells: new Set([
                '0-0', '6-0',
                '0-1', '1-1', '2-1', '4-1', '5-1', '6-1',
                '2-2', '4-2',
                '2-3', '4-3',
                '2-4', '3-4', '4-4'
            ])
        };

        // ==================== DOM ====================
        const boardEl = document.getElementById('gameBoard');
        const boardBgEl = document.getElementById('boardBackground');
        const unitsGrid = document.getElementById('unitsGrid');
        const deleteModeBtn = document.getElementById('deleteModeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyTemplateBtn = document.getElementById('copyTemplateBtn');
        const themeToggle = document.getElementById('themeToggle');
        const toastEl = document.getElementById('toast');

        // Save & Drawer DOM
        const saveTemplateBtn = document.getElementById('saveTemplateBtn');
        const templateNameInput = document.getElementById('templateNameInput');
        const savedTemplatesList = document.getElementById('savedTemplatesList');
        const openDrawerBtn = document.getElementById('openDrawerBtn');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const templatesDrawer = document.getElementById('templatesDrawer');
        const templateCountEl = document.getElementById('templateCount');

        // ==================== Drawer Controls ====================
        function openDrawer() {
            templatesDrawer.classList.add('open');
            drawerOverlay.classList.add('open');
        }

        function closeDrawer() {
            templatesDrawer.classList.remove('open');
            drawerOverlay.classList.remove('open');
        }

        openDrawerBtn.addEventListener('click', openDrawer);
        closeDrawerBtn.addEventListener('click', closeDrawer);
        drawerOverlay.addEventListener('click', closeDrawer);

        // ==================== Helpers ====================
        function showToast(msg, duration = 2200) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        function getCellKey(x, y) {
            return `${x}-${y}`;
        }

        // ==================== Background ====================
        function loadFixedBackground() {
            const url = 'board-bg-hedge.png';
            boardBgEl.style.backgroundImage = `url('${url}')`;

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                state.bgImage = img;
                state.cols = 7;
                state.rows = 5;
                const maxW = window.innerWidth < 768 ? 340 : 700;
                const scale = Math.min(1, maxW / img.naturalWidth);
                state.cellW = Math.round((img.naturalWidth / state.cols) * scale);
                state.cellH = Math.round((img.naturalHeight / state.rows) * scale);
                state.nativeCellW = img.naturalWidth / state.cols;
                state.nativeCellH = img.naturalHeight / state.rows;

                const rawCol = [93, 95, 95, 96, 95, 98, 100];
                const sumCol = rawCol.reduce((a, b) => a + b, 0);
                state.colFracs = rawCol.map(v => v / sumCol);

                const rawRow = [110, 115, 116, 116, 115];
                const sumRow = rawRow.reduce((a, b) => a + b, 0);
                state.rowFracs = rawRow.map(v => v / sumRow);

                createBoard();
            };
            img.src = url;
        }

        // ==================== Board ====================
        function createBoard() {
            boardEl.innerHTML = '';
            if (state.colFracs && state.colFracs.length === state.cols) {
                const totalW = state.cellW * state.cols;
                boardEl.style.gridTemplateColumns = state.colFracs.map(f => Math.round(f * totalW) + 'px').join(' ');
            } else {
                boardEl.style.gridTemplateColumns = `repeat(${state.cols}, ${state.cellW}px)`;
            }
            if (state.rowFracs && state.rowFracs.length === state.rows) {
                const totalH = state.cellH * state.rows;
                boardEl.style.gridTemplateRows = state.rowFracs.map(f => Math.round(f * totalH) + 'px').join(' ');
            } else {
                boardEl.style.gridTemplateRows = `repeat(${state.rows}, ${state.cellH}px)`;
            }
            boardEl.style.setProperty('--cell-w', state.cellW + 'px');
            boardEl.style.setProperty('--cell-h', state.cellH + 'px');

            for (let y = 0; y < state.rows; y++) {
                for (let x = 0; x < state.cols; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;

                    const key = getCellKey(x, y);
                    const isBlocked = state.blockedCells && state.blockedCells.has(key);

                    if (isBlocked) {
                        cell.classList.add('disabled');
                    }

                    if (state.units[key]) {
                        cell.classList.add('has-unit');
                        renderUnitInCell(cell, state.units[key]);
                    }

                    cell.addEventListener('click', () => onCellClick(x, y));

                    cell.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        if (isBlocked) {
                            e.dataTransfer.dropEffect = 'none';
                            return;
                        }
                        e.dataTransfer.dropEffect = 'copy';
                        boardEl.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
                        cell.classList.add('drag-over');
                    });
                    cell.addEventListener('dragleave', (e) => {
                        if (!cell.contains(e.relatedTarget)) {
                            cell.classList.remove('drag-over');
                        }
                    });
                    cell.addEventListener('drop', (e) => {
                        e.preventDefault();
                        boardEl.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
                        
                        if (isBlocked) {
                            showToast('非草地區域（通道/牆壁）不允許放置魔物！');
                            return;
                        }
                        
                        if (state.deleteMode) return;
                        const unitId = e.dataTransfer.getData('text/plain');
                        const icon = state.loadedIcons.find(i => i.id === unitId);
                        if (icon) placeUnit(x, y, icon);
                    });

                    boardEl.appendChild(cell);
                }
            }
        }

        function renderUnitInCell(cell, unitData) {
            const img = document.createElement('img');
            img.className = 'unit-img';
            img.src = unitData.src;
            cell.appendChild(img);
        }

        function placeUnit(x, y, icon) {
            const key = getCellKey(x, y);
            state.units[key] = {
                id: icon.id,
                name: icon.name,
                src: icon.src
            };
            createBoard();
        }

        function onCellClick(x, y) {
            const key = getCellKey(x, y);

            if (state.deleteMode) {
                if (state.units[key]) {
                    delete state.units[key];
                    createBoard();
                    showToast('已刪除');
                }
                return;
            }

            if (state.blockedCells && state.blockedCells.has(key)) {
                showToast('非草地區域（通道/牆壁）不允許放置魔物！');
                return;
            }

            if (state.selectedUnitId) {
                const icon = state.loadedIcons.find(i => i.id === state.selectedUnitId);
                if (icon) placeUnit(x, y, icon);
            }
        }

        // ==================== Auto-load Icons ====================
        async function autoLoadIcons() {
            state.loadedIcons = [];
            unitsGrid.innerHTML = '';
            const maxTry = 50;

            const tryLoad = (n) => new Promise((resolve) => {
                const src = `icon/image${n}.png`;
                const img = new Image();
                img.onload = () => resolve({ n, src, ok: true });
                img.onerror = () => resolve({ n, src, ok: false });
                img.src = src;
            });

            const results = await Promise.all(
                Array.from({ length: maxTry + 1 }, (_, i) => tryLoad(i))
            );

            const found = [];
            results
                .filter(r => r.ok)
                .sort((a, b) => a.n - b.n)
                .forEach(r => {
                    const name = `image${r.n}`;
                    const id = `unit_${r.n}`;
                    const icon = { id, name, src: r.src };
                    state.loadedIcons.push(icon);
                    found.push(icon);
                });

            if (found.length === 0) {
                unitsGrid.innerHTML = `
                    <div class="empty-units">
                        找不到魔物圖片<br>
                        請在 icon 資料夾放入圖片
                    </div>`;
                renderSavedTemplatesList();
                return;
            }

            found.forEach(icon => {
                const opt = document.createElement('div');
                opt.className = 'unit-option';
                opt.dataset.id = icon.id;
                opt.draggable = true;
                opt.title = icon.name + '（拖曳到模板）';

                const img = document.createElement('img');
                img.src = icon.src;
                img.alt = icon.name;
                img.draggable = false;
                opt.appendChild(img);

                opt.addEventListener('click', () => {
                    document.querySelectorAll('.unit-option').forEach(el => el.classList.remove('selected'));
                    opt.classList.add('selected');
                    state.selectedUnitId = icon.id;
                    state.deleteMode = false;
                    deleteModeBtn.classList.remove('active');
                    deleteModeBtn.textContent = '刪除模式';
                });

                opt.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', icon.id);
                    e.dataTransfer.effectAllowed = 'copy';
                    opt.classList.add('selected');
                    state.selectedUnitId = icon.id;
                });

                unitsGrid.appendChild(opt);
            });

            showToast(`已自動載入 ${found.length} 張魔物圖片`);
            renderSavedTemplatesList();
        }

        document.addEventListener('dragend', () => {
            document.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
        });

        // ==================== Controls ====================
        deleteModeBtn.addEventListener('click', () => {
            state.deleteMode = !state.deleteMode;
            deleteModeBtn.classList.toggle('active', state.deleteMode);
            deleteModeBtn.textContent = state.deleteMode ? '取消刪除' : '刪除模式';
            if (state.deleteMode) {
                state.selectedUnitId = null;
                document.querySelectorAll('.unit-option').forEach(el => el.classList.remove('selected'));
            }
        });

        clearBtn.addEventListener('click', () => {
            if (Object.keys(state.units).length === 0) return;
            if (confirm('確定要清空整個模板嗎？')) {
                state.units = {};
                createBoard();
                showToast('模板已清空');
            }
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggle.textContent = isLight ? '深色模式' : '淺色模式';
        });

        // ==================== Copy Template Image ====================
        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                try {
                    canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob empty')), 'image/png');
                } catch (e) {
                    reject(e);
                }
            });
        }

        async function copyBoardTemplate() {
            if (!state.bgImage) {
                showToast('背景圖尚未載入完成，請稍候再試');
                return;
            }

            showToast('正在產生圖片…');

            const canvas = document.createElement('canvas');
            canvas.width = state.bgImage.naturalWidth;
            canvas.height = state.bgImage.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;

            try {
                ctx.drawImage(state.bgImage, 0, 0, canvas.width, canvas.height);
            } catch (e) {
                console.warn('draw bg failed', e);
                showToast('繪製背景失敗');
                return;
            }

            const colW = state.colFracs.map(f => f * canvas.width);
            const rowH = state.rowFracs.map(f => f * canvas.height);

            const colX = [0];
            for (let i = 0; i < state.cols; i++) colX.push(colX[i] + colW[i]);
            const rowY = [0];
            for (let i = 0; i < state.rows; i++) rowY.push(rowY[i] + rowH[i]);

            const drawPromises = [];
            for (const [key, unit] of Object.entries(state.units)) {
                const [x, y] = key.split('-').map(Number);
                drawPromises.push(new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        try {
                            const cellW = colW[x];
                            const cellH = rowH[y];
                            const padX = cellW * 0.08;
                            const padY = cellH * 0.08;

                            const boxW = cellW - padX * 2;
                            const boxH = cellH - padY * 2;

                            const imgAspect = img.naturalWidth / img.naturalHeight;
                            const boxAspect = boxW / boxH;

                            let drawW = boxW;
                            let drawH = boxH;
                            let drawX = colX[x] + padX;
                            let drawY = rowY[y] + padY;

                            if (imgAspect > boxAspect) {
                                drawH = boxW / imgAspect;
                                drawY += (boxH - drawH) / 2;
                            } else {
                                drawW = boxH * imgAspect;
                                drawX += (boxW - drawW) / 2;
                            }

                            ctx.drawImage(img, drawX, drawY, drawW, drawH);
                        } catch (e) {
                            console.warn('draw unit failed', e);
                        }
                        resolve();
                    };
                    img.onerror = resolve;
                    img.src = unit.src;
                }));
            }
            await Promise.all(drawPromises);

            let blob = null;
            try {
                blob = await canvasToBlob(canvas);
            } catch (e) {
                console.warn('toBlob failed, try dataURL', e);
                try {
                    const dataUrl = canvas.toDataURL('image/png');
                    const res = await fetch(dataUrl);
                    blob = await res.blob();
                } catch (e2) {
                    console.warn('dataURL path failed', e2);
                    showToast('產生圖片失敗（可能是圖片跨域限制）');
                    return;
                }
            }

            if (navigator.clipboard && window.ClipboardItem) {
                try {
                    const item = new ClipboardItem({
                        'image/png': blob instanceof Blob ? blob : Promise.resolve(blob)
                    });
                    await navigator.clipboard.write([item]);
                    showToast('已複製模板到剪貼簿！可用 Ctrl+V 貼上');
                    return;
                } catch (err) {
                    console.warn('Clipboard write failed:', err);
                }
            }

            try {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'board-template.png';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                    a.remove();
                }, 2000);
                showToast('無法寫入剪貼簿，已下載 board-template.png');
            } catch (err3) {
                console.warn('Download failed:', err3);
                showToast('複製失敗：請用 Chrome / Edge');
            }
        }

        copyTemplateBtn.addEventListener('click', () => {
            copyTemplateBtn.disabled = true;
            copyBoardTemplate().finally(() => {
                copyTemplateBtn.disabled = false;
            });
        });

        // ==================== Save & Load Template Logic ====================
        saveTemplateBtn.addEventListener('click', () => {
            const rawName = templateNameInput.value.trim();
            const now = new Date();
            const defaultName = `隊形 ${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const templateName = rawName || defaultName;

            const compactUnits = {};
            for (const [key, unitObj] of Object.entries(state.units)) {
                compactUnits[key] = unitObj.id;
            }

            const templates = getSavedTemplates();
            const newTemplate = {
                id: Date.now(),
                name: templateName,
                date: `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`,
                units: compactUnits,
                cols: state.cols,
                rows: state.rows
            };

            templates.unshift(newTemplate);
            saveSavedTemplates(templates);

            templateNameInput.value = '';
            showToast(`已儲存隊形：「${templateName}」！`);
            renderSavedTemplatesList();
        });

        function renderSavedTemplatesList() {
            const templates = getSavedTemplates();
            if (templateCountEl) {
                templateCountEl.textContent = templates.length;
            }
            savedTemplatesList.innerHTML = '';

            if (templates.length === 0) {
                savedTemplatesList.innerHTML = '<div class="empty-units">尚無儲存的隊形模板</div>';
                return;
            }

            templates.forEach((item) => {
                const count = Object.keys(item.units || {}).length;

                const card = document.createElement('div');
                card.className = 'template-card';

                card.innerHTML = `
                    <div class="template-card-title">${item.name}</div>
                    <div class="template-card-meta">時間：${item.date} | 魔物數：${count}</div>
                    <div class="template-card-actions">
                        <button class="success load-btn">載入隊形</button>
                        <button class="secondary rename-btn">改名</button>
                        <button class="danger delete-btn">刪除</button>
                    </div>
                `;

                card.querySelector('.load-btn').addEventListener('click', () => {
                    const restoredUnits = {};
                    const rawUnits = item.units || {};

                    for (const [key, unitId] of Object.entries(rawUnits)) {
                        const actualId = typeof unitId === 'object' ? unitId.id : unitId;
                        const icon = state.loadedIcons.find(i => i.id === actualId);
                        if (icon) {
                            restoredUnits[key] = {
                                id: icon.id,
                                name: icon.name,
                                src: icon.src
                            };
                        }
                    }

                    state.units = restoredUnits;
                    createBoard();
                    closeDrawer();
                    showToast(`已載入隊形：「${item.name}」`);
                });

                card.querySelector('.rename-btn').addEventListener('click', () => {
                    const newName = prompt('請輸入新的模板名稱：', item.name);
                    if (newName !== null) {
                        const trimmed = newName.trim();
                        if (trimmed) {
                            const currentTemplates = getSavedTemplates();
                            const target = currentTemplates.find(t => t.id === item.id);
                            if (target) {
                                target.name = trimmed;
                                saveSavedTemplates(currentTemplates);
                                renderSavedTemplatesList();
                                showToast(`模板已改名為：「${trimmed}」`);
                            }
                        } else {
                            showToast('模板名稱不可為空！');
                        }
                    }
                });

                card.querySelector('.delete-btn').addEventListener('click', () => {
                    if (confirm(`確定要刪除模板「${item.name}」嗎？`)) {
                        const updated = getSavedTemplates().filter(t => t.id !== item.id);
                        saveSavedTemplates(updated);
                        renderSavedTemplatesList();
                        showToast('模板已刪除');
                    }
                });

                savedTemplatesList.appendChild(card);
            });
        }

        // ==================== Init ====================
        createBoard();
        loadFixedBackground();
        autoLoadIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COOP-TD-Template</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #eee;
            --header-bg: #252525;
            --panel-bg: #2d2d2d;
            --cell-bg: rgba(255,255,255,0.04);
            --border-color: #444;
            --shadow-color: rgba(0,0,0,0.4);
            --button-primary: #3a7bc8;
            --button-primary-hover: #4a90e2;
            --button-secondary: #444;
            --button-secondary-hover: #555;
            --button-danger: #c0392b;
            --button-danger-hover: #e74c3c;
            --button-success: #27ae60;
            --button-success-hover: #2ecc71;
            --accent: #5b9bd5;
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --text-color: #222;
            --header-bg: #ffffff;
            --panel-bg: #ffffff;
            --cell-bg: rgba(0,0,0,0.03);
            --border-color: #ddd;
            --shadow-color: rgba(0,0,0,0.08);
            --button-primary: #4a90e2;
            --button-primary-hover: #3a7bc8;
            --button-secondary: #e8e8e8;
            --button-secondary-hover: #d8d8d8;
            --button-danger: #e74c3c;
            --button-danger-hover: #c0392b;
            --button-success: #2ecc71;
            --button-success-hover: #27ae60;
            --accent: #4a90e2;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .fixed-header {
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            padding: 12px 20px;
            box-shadow: 0 2px 12px var(--shadow-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
            align-items: flex-start;
        }

        /* Board */
        .board-wrapper {
            flex: 0 0 auto;
        }

        .board-container {
            position: relative;
            width: fit-content;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow-color);
            background: #222;
            padding: 0;
        }

        .board-background {
            position: absolute;
            inset: 0;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            border-radius: 6px;
            pointer-events: none;
        }

        .board {
            display: grid;
            gap: 0;
            position: relative;
            z-index: 1;
            border: none;
        }

        .cell {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            background: transparent;
            position: relative;
            cursor: pointer;
            transition: background 0.12s;
            overflow: hidden;
            user-select: none;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .cell.drag-over {
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .cell.disabled {
            cursor: not-allowed !important;
            background: transparent;
        }

        .unit-img {
            position: absolute;
            inset: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            object-fit: contain;
            pointer-events: none;
            z-index: 2;
        }

        /* Controls Panel */
        .controls-panel {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section {
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 10px var(--shadow-color);
            width: 100%;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 9px 12px;
            background-color: var(--button-primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            flex: 1;
            min-width: 60px;
            white-space: nowrap;
        }

        button:hover { background-color: var(--button-primary-hover); transform: translateY(-1px); }
        button.secondary { background-color: var(--button-secondary); color: var(--text-color); }
        button.secondary:hover { background-color: var(--button-secondary-hover); }
        button.danger { background-color: var(--button-danger); }
        button.danger:hover { background-color: var(--button-danger-hover); }
        button.success { background-color: var(--button-success); }
        button.success:hover { background-color: var(--button-success-hover); }
        button.active { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Units grid */
        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
            padding: 4px;
            width: 100%;
        }

        .unit-option {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 2px solid transparent;
            background: var(--bg-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: all 0.2s;
            position: relative;
            user-select: none;
        }

        .unit-option:hover { border-color: var(--accent); transform: scale(1.05); }
        .unit-option.selected { border-color: var(--button-primary); box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.35); }
        .unit-option img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .forms-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--button-primary);
            color: #fff;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: bold;
            pointer-events: none;
        }

        .hint { font-size: 12px; opacity: 0.7; margin-top: 6px; line-height: 1.4; }
        .empty-units { text-align: center; padding: 20px 10px; opacity: 0.6; font-size: 13px; grid-column: 1 / -1; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.open { display: flex; }

        .form-modal {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .form-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent);
        }

        .forms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .form-item {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background: var(--bg-color);
            cursor: pointer;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .form-item:hover { border-color: var(--accent); transform: scale(1.05); }
        .form-item.active { border-color: var(--button-success); box-shadow: 0 0 0 2px rgba(39, 174, 96, 0.4); }
        .form-item img { max-width: 100%; max-height: 80%; object-fit: contain; }
        .form-item span { font-size: 10px; margin-top: 4px; opacity: 0.8; }

        /* Drawer Overlay and Container */
        .drawer-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1002; display: none; opacity: 0; transition: opacity 0.3s;
        }
        .drawer-overlay.open { display: block; opacity: 1; }

        .templates-drawer {
            position: fixed; top: 0; right: -360px; width: 350px; height: 100vh;
            background: var(--panel-bg); box-shadow: -4px 0 20px var(--shadow-color);
            z-index: 1003; transition: right 0.3s ease; padding: 20px; display: flex; flex-direction: column; gap: 16px;
        }
        .templates-drawer.open { right: 0; }
        .drawer-close-btn { background: transparent; border: none; color: var(--text-color); font-size: 18px; cursor: pointer; padding: 4px; min-width: auto; flex: initial; }

        .saved-templates-list { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }
        .template-card { background: var(--cell-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .template-card-title { font-weight: bold; font-size: 0.95rem; }
        .template-card-meta { font-size: 0.75rem; opacity: 0.7; }
        .template-card-actions { display: flex; gap: 6px; margin-top: 4px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px;
            z-index: 9999; opacity: 0; transition: all 0.3s; pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="fixed-header">
        <h1 class="header-title">魔物模板編輯器</h1>
        <div class="header-actions">
            <button id="openDrawerBtn" class="primary">📁 模板庫</button>
            <button id="themeToggle" class="secondary">淺色模式</button>
        </div>
    </div>

    <!-- 形態選擇彈窗 (Form Modal) -->
    <div class="modal-overlay" id="formModalOverlay">
        <div class="form-modal">
            <div class="form-modal-header">
                <span id="formModalTitle">選擇魔物形態</span>
                <button class="drawer-close-btn" id="closeFormModalBtn">✕</button>
            </div>
            <div class="forms-grid" id="formsGrid"></div>
        </div>
    </div>

    <!-- 側邊欄遮罩與抽屜 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="templates-drawer" id="templatesDrawer">
        <div class="section-title">
            <span>📁 模板庫</span>
            <button class="drawer-close-btn" id="closeDrawerBtn">✕</button>
        </div>
        <div class="saved-templates-list" id="savedTemplatesList"></div>
    </div>

    <div class="container">
        <!-- Board -->
        <div class="board-wrapper">
            <div class="board-container">
                <div class="board-background" id="boardBackground"></div>
                <div class="board" id="gameBoard"></div>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <div class="section">
                <div class="section-title">魔物圖片</div>
                <div class="units-grid" id="unitsGrid">
                    <div class="empty-units">正在讀取 icon 資料夾…</div>
                </div>
                <div class="hint">💡 點擊選取魔物，<b>再次點擊或雙擊已選取魔物</b>可選擇形態</div>
                <div class="hint">💡 <b>雙擊地圖上的魔物</b>也可單獨切換該格形態</div>
            </div>

            <div class="section">
                <div class="section-title">操作</div>
                <div class="button-group">
                    <button id="deleteModeBtn" class="secondary">刪除模式</button>
                    <button id="clearBtn" class="danger">清空模板</button>
                </div>
                <div class="button-group" style="margin-top:8px;">
                    <button id="copyTemplateBtn" class="success">複製模板圖片</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">儲存目前模板</div>
                <input type="text" id="templateNameInput" placeholder="輸入模板名稱" maxlength="20">
                <div class="button-group" style="margin-top: 8px;">
                    <button id="saveTemplateBtn" class="primary">儲存至模板庫</button>
                    <!-- 動態顯示的更新模板按鈕 -->
                    <button id="updateTemplateBtn" class="success" style="display: none;">更新模板</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== Storage ====================
        const STORAGE_KEY = 'coop_saved_templates';

        function getSavedTemplates() {
            try {
                const localData = localStorage.getItem(STORAGE_KEY);
                if (localData) return JSON.parse(localData);
            } catch (e) {}
            return [];
        }

        function saveSavedTemplates(templates) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(templates));
            } catch (e) {}
        }

        // ==================== 舊格式容錯解析器 ====================
        function normalizePlacedUnit(placed) {
            if (!placed) return null;

            let baseId = null;
            let formIndex = 0;

            if (typeof placed === 'object' && placed !== null) {
                if (placed.baseId) baseId = String(placed.baseId);
                else if (placed.id) baseId = String(placed.id);
                else if (placed.unitId) baseId = String(placed.unitId);

                if (typeof placed.formIndex === 'number') {
                    formIndex = placed.formIndex;
                }

                if (!baseId && (placed.src || placed.img || placed.image)) {
                    placed = placed.src || placed.img || placed.image;
                }
            }

            if (typeof placed === 'number') {
                baseId = `monster_${placed}`;
            }

            if (typeof placed === 'string') {
                const matchMulti = placed.match(/image(\d+)_(\d+)\.png/i);
                if (matchMulti) {
                    baseId = `monster_${matchMulti[1]}`;
                    formIndex = Math.max(0, parseInt(matchMulti[2], 10) - 1);
                } else {
                    const matchSingle = placed.match(/image(\d+)\.png/i);
                    if (matchSingle) {
                        baseId = `monster_${matchSingle[1]}`;
                        formIndex = 0;
                    } else if (placed.startsWith('monster_')) {
                        baseId = placed;
                    } else if (placed.startsWith('monster')) {
                        baseId = `monster_${placed.replace('monster', '')}`;
                    } else if (!isNaN(parseInt(placed, 10))) {
                        baseId = `monster_${parseInt(placed, 10)}`;
                    }
                }
            }

            if (!baseId) return null;

            if (!baseId.startsWith('monster_')) {
                const num = baseId.replace(/\D/g, '');
                if (num) baseId = `monster_${num}`;
            }

            return { baseId, formIndex };
        }

        // ==================== State ====================
        const state = {
            cols: 7, rows: 5,
            cellW: 105, cellH: 112,
            colFracs: null, rowFracs: null,
            selectedUnitId: null,
            selectedFormIndex: 0,
            deleteMode: false,
            units: {}, 
            loadedMonsters: [], 
            bgImage: null,
            currentLoadedTemplateId: null, // 紀錄目前載入的模板 ID

            blockedCells: new Set([
                '0-0', '6-0',
                '0-1', '1-1', '2-1', '4-1', '5-1', '6-1',
                '2-2', '4-2',
                '2-3', '4-3',
                '2-4', '3-4', '4-4'
            ])
        };

        // ==================== DOM ====================
        const boardEl = document.getElementById('gameBoard');
        const boardBgEl = document.getElementById('boardBackground');
        const unitsGrid = document.getElementById('unitsGrid');
        const deleteModeBtn = document.getElementById('deleteModeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyTemplateBtn = document.getElementById('copyTemplateBtn');
        const themeToggle = document.getElementById('themeToggle');
        const toastEl = document.getElementById('toast');

        const formModalOverlay = document.getElementById('formModalOverlay');
        const closeFormModalBtn = document.getElementById('closeFormModalBtn');
        const formsGrid = document.getElementById('formsGrid');
        const formModalTitle = document.getElementById('formModalTitle');

        const saveTemplateBtn = document.getElementById('saveTemplateBtn');
        const updateTemplateBtn = document.getElementById('updateTemplateBtn');
        const templateNameInput = document.getElementById('templateNameInput');
        const savedTemplatesList = document.getElementById('savedTemplatesList');
        const openDrawerBtn = document.getElementById('openDrawerBtn');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const templatesDrawer = document.getElementById('templatesDrawer');

        // ==================== Helpers ====================
        function showToast(msg, duration = 2200) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        function getCellKey(x, y) { return `${x}-${y}`; }

        // 設定目前載入的模板狀態
        function setLoadedTemplate(template) {
            if (template) {
                state.currentLoadedTemplateId = template.id;
                templateNameInput.value = template.name;
                updateTemplateBtn.style.display = 'block';
            } else {
                state.currentLoadedTemplateId = null;
                templateNameInput.value = '';
                updateTemplateBtn.style.display = 'none';
            }
        }

        // ==================== Form Switcher Modal ====================
        function openFormModalForMenu(monster) {
            if (!monster || monster.forms.length <= 1) {
                showToast('該魔物只有單一形態');
                return;
            }

            formModalTitle.textContent = `${monster.name} - 選擇預設放置形態`;
            formsGrid.innerHTML = '';

            monster.forms.forEach((form, idx) => {
                const item = document.createElement('div');
                item.className = `form-item ${idx === state.selectedFormIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <img src="${form.src}" alt="${form.name}">
                    <span>${form.name}</span>
                `;
                item.addEventListener('click', () => {
                    state.selectedFormIndex = idx;
                    const opt = unitsGrid.querySelector(`[data-id="${monster.id}"]`);
                    if (opt) {
                        const optImg = opt.querySelector('img');
                        if (optImg) optImg.src = form.src;
                    }
                    closeFormModal();
                    showToast(`預設放置形態設為：${form.name}`);
                });
                formsGrid.appendChild(item);
            });

            formModalOverlay.classList.add('open');
        }

        function openFormModalForCell(cellKey) {
            const rawPlaced = state.units[cellKey];
            const placed = normalizePlacedUnit(rawPlaced);
            if (!placed) return;

            const monster = state.loadedMonsters.find(m => m.id === placed.baseId);
            if (!monster || monster.forms.length <= 1) {
                showToast('該魔物只有單一形態');
                return;
            }

            formModalTitle.textContent = `${monster.name} - 切換格子形態`;
            formsGrid.innerHTML = '';

            monster.forms.forEach((form, idx) => {
                const item = document.createElement('div');
                item.className = `form-item ${idx === placed.formIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <img src="${form.src}" alt="${form.name}">
                    <span>${form.name}</span>
                `;
                item.addEventListener('click', () => {
                    state.units[cellKey] = {
                        baseId: placed.baseId,
                        formIndex: idx
                    };
                    createBoard();
                    closeFormModal();
                    showToast(`格子形態已切換為：${form.name}`);
                });
                formsGrid.appendChild(item);
            });

            formModalOverlay.classList.add('open');
        }

        function closeFormModal() {
            formModalOverlay.classList.remove('open');
        }

        closeFormModalBtn.addEventListener('click', closeFormModal);
        formModalOverlay.addEventListener('click', (e) => {
            if (e.target === formModalOverlay) closeFormModal();
        });

        // ==================== Drawer Controls ====================
        openDrawerBtn.addEventListener('click', () => { templatesDrawer.classList.add('open'); drawerOverlay.classList.add('open'); });
        function closeDrawer() { templatesDrawer.classList.remove('open'); drawerOverlay.classList.remove('open'); }
        closeDrawerBtn.addEventListener('click', closeDrawer);
        drawerOverlay.addEventListener('click', closeDrawer);

        // ==================== Background & Board ====================
        function loadFixedBackground() {
            const url = 'board-bg-hedge.png';
            boardBgEl.style.backgroundImage = `url('${url}')`;

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                state.bgImage = img;
                state.cols = 7; state.rows = 5;
                const maxW = window.innerWidth < 768 ? 340 : 700;
                const scale = Math.min(1, maxW / img.naturalWidth);
                state.cellW = Math.round((img.naturalWidth / state.cols) * scale);
                state.cellH = Math.round((img.naturalHeight / state.rows) * scale);

                const rawCol = [93, 95, 95, 96, 95, 98, 100];
                const sumCol = rawCol.reduce((a, b) => a + b, 0);
                state.colFracs = rawCol.map(v => v / sumCol);

                const rawRow = [110, 115, 116, 116, 115];
                const sumRow = rawRow.reduce((a, b) => a + b, 0);
                state.rowFracs = rawRow.map(v => v / sumRow);

                createBoard();
            };
            img.src = url;
        }

        function createBoard() {
            boardEl.innerHTML = '';
            const totalW = state.cellW * state.cols;
            const totalH = state.cellH * state.rows;
            boardEl.style.gridTemplateColumns = state.colFracs ? state.colFracs.map(f => Math.round(f * totalW) + 'px').join(' ') : `repeat(${state.cols}, ${state.cellW}px)`;
            boardEl.style.gridTemplateRows = state.rowFracs ? state.rowFracs.map(f => Math.round(f * totalH) + 'px').join(' ') : `repeat(${state.rows}, ${state.cellH}px)`;

            for (let y = 0; y < state.rows; y++) {
                for (let x = 0; x < state.cols; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const key = getCellKey(x, y);
                    const isBlocked = state.blockedCells && state.blockedCells.has(key);

                    if (isBlocked) cell.classList.add('disabled');

                    const rawPlaced = state.units[key];
                    const placed = normalizePlacedUnit(rawPlaced);
                    
                    if (placed) {
                        state.units[key] = placed;
                        const monster = state.loadedMonsters.find(m => m.id === placed.baseId);
                        if (monster) {
                            const targetForm = monster.forms[placed.formIndex] || monster.forms[0];
                            if (targetForm) {
                                const img = document.createElement('img');
                                img.className = 'unit-img';
                                img.src = targetForm.src;
                                cell.appendChild(img);
                            }
                        }
                    }

                    cell.addEventListener('click', () => onCellClick(x, y));
                    cell.addEventListener('dblclick', (e) => {
                        e.preventDefault();
                        if (state.units[key]) openFormModalForCell(key);
                    });

                    cell.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        if (isBlocked) return;
                        boardEl.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
                        cell.classList.add('drag-over');
                    });
                    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
                    cell.addEventListener('drop', (e) => {
                        e.preventDefault();
                        boardEl.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
                        if (isBlocked) return showToast('非草地區域無法放置魔物！');
                        
                        const monsterId = e.dataTransfer.getData('text/plain');
                        if (monsterId) placeUnit(x, y, monsterId, state.selectedFormIndex);
                    });

                    boardEl.appendChild(cell);
                }
            }
        }

        function placeUnit(x, y, monsterId, formIndex = 0) {
            const key = getCellKey(x, y);
            state.units[key] = {
                baseId: monsterId,
                formIndex: formIndex
            };
            createBoard();
        }

        function onCellClick(x, y) {
            const key = getCellKey(x, y);

            if (state.deleteMode) {
                if (state.units[key]) {
                    delete state.units[key];
                    createBoard();
                    showToast('已刪除');
                }
                return;
            }

            if (state.blockedCells && state.blockedCells.has(key)) {
                showToast('非草地區域無法放置魔物！');
                return;
            }

            if (state.selectedUnitId) {
                placeUnit(x, y, state.selectedUnitId, state.selectedFormIndex);
            }
        }

        // ==================== Dynamic Icon Scanning (優化版：全平行非同步請求) ====================
        async function autoLoadIcons() {
            unitsGrid.innerHTML = '<div class="empty-units">正在快速讀取 icon 資料夾…</div>';
            state.loadedMonsters = [];

            const tryLoadImage = (src) => new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve({ src, ok: true });
                img.onerror = () => resolve({ src, ok: false });
                img.src = src;
            });

            // 針對單一魔物平行檢測多種形態與單形態圖片
            const checkMonster = async (m) => {
                const multiSrcs = Array.from({ length: 5 }, (_, i) => `icon/image${m}_${i + 1}.png`);
                const singleSrc = `icon/image${m}.png`;

                // 平行發送該魔物的所有圖片請求，避免串行等待
                const results = await Promise.all([
                    ...multiSrcs.map(src => tryLoadImage(src)),
                    tryLoadImage(singleSrc)
                ]);

                const multiResults = results.slice(0, 5);
                const singleResult = results[5];

                const forms = [];
                if (multiResults[0].ok) {
                    for (let i = 0; i < 5; i++) {
                        if (multiResults[i].ok) {
                            forms.push({ formIndex: i, src: multiSrcs[i], name: `形態 ${i + 1}` });
                        } else {
                            break;
                        }
                    }
                } else if (singleResult.ok) {
                    forms.push({ formIndex: 0, src: singleSrc, name: `預設形態` });
                }

                if (forms.length > 0) {
                    return {
                        id: `monster_${m}`,
                        monsterNum: m,
                        name: `魔物 ${m}`,
                        forms: forms
                    };
                }
                return null;
            };

            // 1 ~ 30 號魔物全部同時進行平行掃描
            const monsterPromises = Array.from({ length: 30 }, (_, i) => checkMonster(i + 1));
            const results = await Promise.all(monsterPromises);

            // 過濾無效魔物並依編號排序
            state.loadedMonsters = results.filter(Boolean).sort((a, b) => a.monsterNum - b.monsterNum);

            unitsGrid.innerHTML = '';

            if (state.loadedMonsters.length === 0) {
                unitsGrid.innerHTML = `<div class="empty-units">未找到魔物圖片<br>請在 icon 資料夾放圖片<br>(如 image1_1.png)</div>`;
                renderSavedTemplatesList();
                createBoard();
                return;
            }

            state.loadedMonsters.forEach(monster => {
                const opt = document.createElement('div');
                opt.className = 'unit-option';
                opt.dataset.id = monster.id;
                opt.draggable = true;
                opt.title = `${monster.name}（包含 ${monster.forms.length} 種形態，點擊切換形態）`;

                const img = document.createElement('img');
                img.src = monster.forms[0].src;
                img.draggable = false;
                opt.appendChild(img);

                if (monster.forms.length > 1) {
                    const badge = document.createElement('span');
                    badge.className = 'forms-badge';
                    badge.textContent = `${monster.forms.length}形態`;
                    opt.appendChild(badge);
                }

                const handleOptionSelect = () => {
                    const isAlreadySelected = (state.selectedUnitId === monster.id);

                    if (isAlreadySelected) {
                        openFormModalForMenu(monster);
                    } else {
                        document.querySelectorAll('.unit-option').forEach(el => el.classList.remove('selected'));
                        opt.classList.add('selected');
                        state.selectedUnitId = monster.id;
                        state.selectedFormIndex = 0;
                        state.deleteMode = false;
                        deleteModeBtn.classList.remove('active');
                        deleteModeBtn.textContent = '刪除模式';

                        if (monster.forms.length > 1) {
                            showToast(`已選取 ${monster.name}，再次點擊可切換形態`);
                        }
                    }
                };

                opt.addEventListener('click', handleOptionSelect);
                opt.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    if (monster.forms.length > 1) openFormModalForMenu(monster);
                });

                opt.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', monster.id);
                    document.querySelectorAll('.unit-option').forEach(el => el.classList.remove('selected'));
                    opt.classList.add('selected');
                    state.selectedUnitId = monster.id;
                });

                unitsGrid.appendChild(opt);
            });

            createBoard();
            renderSavedTemplatesList();
        }

        // ==================== Controls ====================
        deleteModeBtn.addEventListener('click', () => {
            state.deleteMode = !state.deleteMode;
            deleteModeBtn.classList.toggle('active', state.deleteMode);
            deleteModeBtn.textContent = state.deleteMode ? '取消刪除' : '刪除模式';
            if (state.deleteMode) {
                state.selectedUnitId = null;
                document.querySelectorAll('.unit-option').forEach(el => el.classList.remove('selected'));
            }
        });

        clearBtn.addEventListener('click', () => {
            if (Object.keys(state.units).length === 0) return;
            if (confirm('確定要清空目前的畫布內容嗎？')) {
                state.units = {};
                setLoadedTemplate(null); // 清空時重置載入狀態
                createBoard();
                showToast('模板已清空');
            }
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeToggle.textContent = document.body.classList.contains('light-mode') ? '深色模式' : '淺色模式';
        });

        // ==================== Copy Canvas Image ====================
        async function copyBoardTemplate() {
            if (!state.bgImage) return showToast('背景圖未載入');
            showToast('正在產生圖片…');

            const canvas = document.createElement('canvas');
            canvas.width = state.bgImage.naturalWidth;
            canvas.height = state.bgImage.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(state.bgImage, 0, 0, canvas.width, canvas.height);

            const colW = state.colFracs.map(f => f * canvas.width);
            const rowH = state.rowFracs.map(f => f * canvas.height);
            const colX = [0]; for (let i = 0; i < state.cols; i++) colX.push(colX[i] + colW[i]);
            const rowY = [0]; for (let i = 0; i < state.rows; i++) rowY.push(rowY[i] + rowH[i]);

            const drawPromises = [];
            for (const [key, rawPlaced] of Object.entries(state.units)) {
                const placed = normalizePlacedUnit(rawPlaced);
                if (!placed) continue;

                const [x, y] = key.split('-').map(Number);
                const monster = state.loadedMonsters.find(m => m.id === placed.baseId);
                if (!monster) continue;
                const targetForm = monster.forms[placed.formIndex] || monster.forms[0];
                if (!targetForm) continue;

                drawPromises.push(new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        const cellW = colW[x], cellH = rowH[y];
                        const padX = cellW * 0.08, padY = cellH * 0.08;
                        const boxW = cellW - padX * 2, boxH = cellH - padY * 2;
                        const imgAspect = img.naturalWidth / img.naturalHeight;
                        const boxAspect = boxW / boxH;

                        let drawW = boxW, drawH = boxH, drawX = colX[x] + padX, drawY = rowY[y] + padY;
                        if (imgAspect > boxAspect) {
                            drawH = boxW / imgAspect; drawY += (boxH - drawH) / 2;
                        } else {
                            drawW = boxH * imgAspect; drawX += (boxW - drawW) / 2;
                        }
                        ctx.drawImage(img, drawX, drawY, drawW, drawH);
                        resolve();
                    };
                    img.onerror = resolve;
                    img.src = targetForm.src;
                }));
            }
            await Promise.all(drawPromises);

            canvas.toBlob(async (blob) => {
                if (navigator.clipboard && window.ClipboardItem) {
                    try {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        showToast('已複製模板到剪貼簿！');
                        return;
                    } catch (e) {}
                }
                showToast('無法複製至剪貼簿，已為您下載圖片');
            });
        }

        copyTemplateBtn.addEventListener('click', copyBoardTemplate);

        // ==================== Save & Load & Update Templates ====================
        // 1. 儲存為全新模板
        saveTemplateBtn.addEventListener('click', () => {
            const rawName = templateNameInput.value.trim();
            const now = new Date();
            const defaultName = `隊形 ${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const templateName = rawName || defaultName;

            const newTemplate = {
                id: Date.now(),
                name: templateName,
                date: `${now.getMonth()+1}/${now.getDate()}`,
                units: JSON.parse(JSON.stringify(state.units))
            };

            const templates = getSavedTemplates();
            templates.unshift(newTemplate);
            saveSavedTemplates(templates);

            // 儲存後自動設定為目前載入狀態
            setLoadedTemplate(newTemplate);

            showToast(`已儲存隊形：「${templateName}」！`);
            renderSavedTemplatesList();
        });

        // 2. 更新現有模板
        updateTemplateBtn.addEventListener('click', () => {
            if (!state.currentLoadedTemplateId) return;

            const templates = getSavedTemplates();
            const index = templates.findIndex(t => t.id === state.currentLoadedTemplateId);

            if (index === -1) {
                showToast('找不到原模板，可能已被刪除');
                setLoadedTemplate(null);
                return;
            }

            const rawName = templateNameInput.value.trim();
            const now = new Date();
            const updatedName = rawName || templates[index].name;

            templates[index].name = updatedName;
            templates[index].date = `${now.getMonth()+1}/${now.getDate()}`;
            templates[index].units = JSON.parse(JSON.stringify(state.units));

            saveSavedTemplates(templates);
            showToast(`已更新隊形：「${updatedName}」！`);
            renderSavedTemplatesList();
        });

        function renderSavedTemplatesList() {
            const templates = getSavedTemplates();
            savedTemplatesList.innerHTML = templates.length === 0 ? '<div class="empty-units">尚無儲存的隊形模板</div>' : '';

            templates.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'template-card';
                card.innerHTML = `
                    <div class="template-card-title">${item.name}</div>
                    <div class="template-card-meta">時間：${item.date} | 魔物數：${Object.keys(item.units || {}).length}</div>
                    <div class="template-card-actions">
                        <button class="success load-btn">載入隊形</button>
                        <button class="danger delete-btn">刪除</button>
                    </div>
                `;

                // 載入按鈕邏輯
                card.querySelector('.load-btn').addEventListener('click', () => {
                    const rawUnits = item.units || {};
                    const normalizedUnits = {};
                    for (const [key, val] of Object.entries(rawUnits)) {
                        const norm = normalizePlacedUnit(val);
                        if (norm) normalizedUnits[key] = norm;
                    }

                    state.units = JSON.parse(JSON.stringify(normalizedUnits));
                    setLoadedTemplate(item); // 帶入名稱並顯示更新按鈕
                    createBoard();
                    closeDrawer();
                    showToast(`已成功載入隊形：「${item.name}」`);
                });

                // 刪除按鈕邏輯
                card.querySelector('.delete-btn').addEventListener('click', () => {
                    if (confirm(`確定要刪除隊形模板「${item.name}」嗎？`)) {
                        saveSavedTemplates(getSavedTemplates().filter(t => t.id !== item.id));
                        // 若刪除的是當前載入的模板，則重置狀態
                        if (state.currentLoadedTemplateId === item.id) {
                            setLoadedTemplate(null);
                        }
                        renderSavedTemplatesList();
                        showToast('模板已刪除');
                    }
                });

                savedTemplatesList.appendChild(card);
            });
        }

        // ==================== Init ====================
        createBoard();
        loadFixedBackground();
        autoLoadIcons();
    </script>
</body>

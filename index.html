<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔物模板編輯器</title>
    
    <!-- 1. 先載入基礎共用樣式（包含 CSS 變數） -->
    <link rel="stylesheet" href="style_base.css">
    
    <!-- 2. 再依據螢幕寬度載入對應佈局 -->
    <link rel="stylesheet" href="style_window.css">
    <link rel="stylesheet" href="style_mobile.css">
    
    <!-- JS 依據裝置自動載入 -->
    <script>
        if (window.innerWidth <= 900) {
            var script = document.createElement('script');
            script.src = 'script_mobile.js';
            script.defer = true;
            document.head.appendChild(script);
        } else {
            var script = document.createElement('script');
            script.src = 'script_window.js';
            script.defer = true;
            document.head.appendChild(script);
        }
    </script>
</head>
<body>
    <div class="fixed-header">
        <!-- 左側標題與更新記錄按鈕 -->
        <div class="header-left-group">
            <h1 class="header-title">魔物模板編輯器</h1>
            <button id="updateLogBtn" class="secondary">更新記錄</button>
        </div>

        <!-- 中間：選擇地形與模板名稱與儲存/更新區塊 -->
        <div class="header-save-group">
            <select id="bgSelect" class="bg-select header-bg-select">
                <option value="background/board-bg-hedge.png">綠籬地形 (預設)</option>
                <option value="background/board-bg-guardwall.png">城牆地形</option>
            </select>
            <input type="text" id="templateNameInput" placeholder="輸入模板名稱 (最多20字)" maxlength="20">
            <button id="saveTemplateBtn" class="primary" style="display: none;">儲存</button>
            <button id="updateTemplateBtn" class="success" style="display: none;">更新</button>
        </div>

        <!-- 右側動作按鈕 -->
        <div class="header-actions">
            <button id="openDrawerBtn" class="primary">📁 模板庫</button>
            <button id="themeToggle" class="secondary">淺色模式</button>
        </div>
    </div>

    <div class="modal-overlay" id="formModalOverlay">
        <div class="form-modal">
            <div class="form-modal-header">
                <span id="formModalTitle">選擇魔物形態</span>
                <button class="drawer-close-btn" id="closeFormModalBtn">✕</button>
            </div>
            <div class="forms-grid" id="formsGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="updateLogOverlay">
        <div class="log-modal">
            <div class="form-modal-header">
                <span>更新記錄</span>
                <button class="drawer-close-btn" id="closeUpdateLogBtn">✕</button>
            </div>
            <div class="log-list">
                <div class="log-item">
                    <div class="log-date">2026/10/12</div>
                    <div class="log-text">
                        • 將選擇地形下拉選單移至頂部導覽列（位於模板名稱左側），優化電腦版排版。<br>
                        • 調整三欄式面板佈局與右側面板工具按鈕垂直排列。<br>
                        • 新增復原 (Undo) 與重做 (Redo) 操作按鈕。
                    </div>
                </div>
                <div class="log-item">
                    <div class="log-date">2026/09/26</div>
                    <div class="log-text">
                        • 新增資料夾拖曳排序功能，支援按住資料夾進行位置調整。<br>
                        • 支援資料夾間的多層級嵌套。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="templates-drawer" id="templatesDrawer">
        <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; font-size: 1.1rem; color: var(--accent);">📁 模板庫</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="addFolderBtn" class="secondary" style="padding: 4px 10px; font-size: 12px; cursor: pointer;">📁 新增資料夾</button>
                <button class="drawer-close-btn" id="closeDrawerBtn">✕</button>
            </div>
        </div>
        <div class="saved-templates-list" id="savedTemplatesList"></div>
    </div>

    <div class="container">
        <!-- 左側面板：魔物 -->
        <div class="panel-left">
            <div class="section">
                <div class="section-title">魔物</div>
                <div class="units-grid" id="unitsGrid">
                    <div class="empty-units">正在讀取 icon 資料夾…</div>
                </div>
                <div class="hint">💡 點擊選取魔物，再次點擊模板即可放下</div>
                <div class="hint">💡 點擊已選取魔物或雙擊棋盤魔物可切換形態</div>
            </div>
        </div>

        <!-- 中間面板：棋盤與說明 -->
        <div class="board-wrapper">
            <div class="board-container" id="boardContainer">
                <div class="board-background" id="boardBackground"></div>
                <div class="board" id="gameBoard"></div>
            </div>
            <div class="section" style="margin-top: 16px;">
                <div class="section-title">陣容說明</div>
                <textarea id="templateDescInput" placeholder="請輸入此陣容的詳細說明、打法技巧或注意事項..." rows="5" style="width: 100%; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); padding: 10px; font-size: 14px; outline: none; resize: vertical; box-sizing: border-box;"></textarea>
            </div>
        </div>

        <!-- 右側面板：工具與操作 -->
        <div class="panel-right">
            <div class="section">
                <div class="section-title">工具與操作</div>
                <div class="button-column">
                    <button id="undoBtn" class="secondary" disabled>↩️ 復原</button>
                    <button id="redoBtn" class="secondary" disabled>↪️ 重做</button>
                    <button id="deleteModeBtn" class="secondary">🗑️ 刪除</button>
                    <button id="markOrderBtn" class="secondary">🔢 標示製作順序</button>
                    <button id="clearBtn" class="danger">清空</button>
                    <button id="copyTemplateBtn" class="success">複製模板圖片</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</body>
</html>
